; Sensormeter Display XL (ESP32-8048S070C: ESP32-S3, 7" 800x480 RGB-Parallel,
; kapazitiver GT911-Touch, 16 MB Flash, 8 MB Octal-PSRAM).
;
; Portiert von sm-display (HW-458B / ESP-WROOM-32 / 2,8" ST7789 SPI): die
; Display-Schicht wurde von TFT_eSPI (kann nur SPI-Panels) auf LovyanGFX
; umgestellt (treibt das RGB-Parallel-Panel UND den GT911, mit TFT_eSPI-naher
; API - siehe include/LGFX_XL.h und DisplayManager). Ausrichtung: horizontal.

[env:esp32-8048S070C]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 16 MB Flash + 8 MB Octal-PSRAM (Board-Default esp32-s3-devkitc-1 ist N8 ohne
; PSRAM -> uebersteuern). qio_opi = QIO-Flash + OPI(octal)-PSRAM.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_ota_16m.csv

lib_deps =
	lovyan03/LovyanGFX @ ^1.1.16
	adafruit/DHT sensor library @ ^1.4.6
	adafruit/Adafruit Unified Sensor @ ^1.1.14
	marian-craciunescu/ESP32Ping @ ^1.7
	esp32async/ESPAsyncWebServer @ ^3.11.2
	esp32async/AsyncTCP @ ^3.4.10

build_flags =
	-D BOARD_HAS_PSRAM
	; Framebuffer/grosse Puffer bevorzugt ins PSRAM
	-D LGFX_USE_V1
	-D DISABLE_ALL_LIBRARY_WARNINGS
	; deutsche Umlaute direkt in String-Literalen
	-finput-charset=UTF-8
	-fexec-charset=UTF-8
